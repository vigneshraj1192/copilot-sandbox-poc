[project]
name = "repo-sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "vignesh.rajaganapathy@ideas2it.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docker>=7.2.0",
    "networkx>=3.7",
    "pathspec>=1.1.1",
    "tiktoken>=0.14.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-python>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sandbox"

